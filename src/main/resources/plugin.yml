name: DayLight
version: '1.0.0'
main: de.mcterranova.dayLight.DayLight
api-version: '1.21.11'
authors: [ Bastizeit ]
commands:
  daynightreload:
    description: Reloads the day/night timer configuration.
    usage: /daynightreload
  addtime:
    description: Adds time to the day/night timer.
    usage: /addtime <ticks>